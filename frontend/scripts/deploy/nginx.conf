
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

pid        /tmp/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;
  server_tokens off;

  types {
    application/javascript  mjs;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip compression — 大幅减少 JS/CSS 传输体积
  gzip on;
  gzip_buffers 32 16k;
  gzip_comp_level 6;
  gzip_min_length 1k;
  gzip_static on;
  gzip_types text/plain
    text/css
    application/javascript
    application/json
    application/x-javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;
  gzip_vary on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $ingress_scheme {
    default $scheme;
    http http;
    https https;
  }

  server {
    listen 8080;
    server_name localhost;

    # 保留企业 Host，转发到同一 Compose 网络内的 API / Preserve tenant Host across the same-origin proxy.
    resolver 127.0.0.11 ipv6=off valid=30s;
    location ~ ^/(?:admin|tenant|api|files|plugin-assets|plugin-public-assets|plugin-icons|sio|webhooks)(?:/|$) {
      set $backend_origin http://backend-api:8000;
      proxy_pass $backend_origin;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $ingress_scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 600s;
      client_max_body_size 0;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    # 静态资源长缓存（Vite 产物带 hash，可安全缓存 1 年）
    location /assets/ {
      root /usr/share/nginx/html;
      expires 365d;
      add_header Cache-Control "public, immutable";
    }

    # 图标与字体资源
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
      root /usr/share/nginx/html;
      expires 30d;
      add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
